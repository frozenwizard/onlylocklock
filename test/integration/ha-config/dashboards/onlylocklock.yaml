title: onlylocklock
views:
  - title: Rows
    path: rows
    cards:
      - type: entities
        title: Rows under test
        entities:
          - entity: lock.test_lock
            type: custom:only-lock-lock-row
          - entity: cover.test_cover
            type: custom:only-close-cover-row
          - entity: alarm_control_panel.test_alarm
            type: custom:only-arm-alarm-row
          - entity: lock.code_lock
            type: custom:only-lock-lock-row
          - entity: alarm_control_panel.code_alarm
            type: custom:only-arm-alarm-row
          - entity: lock.unavailable_lock
            type: custom:only-lock-lock-row
          # The rows ignore these actions, so this one must never open more-info either.
          - entity: alarm_control_panel.test_alarm
            type: custom:only-arm-alarm-row
            name: Alarm with tap actions
            tap_action:
              action: more-info
            hold_action:
              action: more-info
            double_tap_action:
              action: more-info
      # A standard row, so the more-info test can show that its check does see the popup.
      - type: entities
        title: Control
        entities:
          - entity: lock.test_lock
            name: Control lock
  # Each of these rows has a config error.
  - title: Errors
    path: errors
    cards:
      - type: entities
        title: Misconfigured rows
        entities:
          - type: custom:only-lock-lock-row
          - entity: lock.test_lock
            type: custom:only-close-cover-row
          - entity: alarm_control_panel.test_alarm
            type: custom:only-arm-alarm-row
            labels:
              disarm: Disarm
