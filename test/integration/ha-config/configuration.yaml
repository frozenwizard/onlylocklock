# Minimal Home Assistant config for the integration tests. Everything here is
# deterministic: the lock and cover are template entities backed by input
# booleans, and the alarms are manual panels that arm instantly.

homeassistant:
  name: onlylocklock test
  time_zone: UTC
  country: US
  auth_providers:
    # Logs the browser in as the only user, with no login page. Trusting every
    # address is only safe because the port listens on 127.0.0.1.
    - type: trusted_networks
      trusted_networks:
        - 0.0.0.0/0
        - ::/0
      allow_bypass_login: true
    # Onboarding creates the test user through this provider.
    - type: homeassistant

frontend:
# The frontend calls recorder/info on every page.
recorder:

lovelace:
  resource_mode: yaml
  resources:
    - url: /local/onlylocklock/content.js
      type: module
  dashboards:
    onlylocklock-test:
      mode: yaml
      title: onlylocklock
      filename: dashboards/onlylocklock.yaml

input_boolean:
  test_lock_locked:
  code_lock_locked:
  slow_lock_locked:
  test_cover_closed:

template:
  - lock:
      - name: Test lock
        unique_id: test_lock
        state: "{{ 'locked' if is_state('input_boolean.test_lock_locked', 'on') else 'unlocked' }}"
        lock:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.test_lock_locked
        unlock:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.test_lock_locked
      # HA rejects lock and unlock calls without a 4-digit code.
      - name: Code lock
        unique_id: code_lock
        code_format: "{{ '^\\d{4}$' }}"
        state: "{{ 'locked' if is_state('input_boolean.code_lock_locked', 'on') else 'unlocked' }}"
        lock:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.code_lock_locked
        unlock:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.code_lock_locked
      # Takes 2 seconds to lock, so the test can see the row while the call runs.
      - name: Slow lock
        unique_id: slow_lock
        state: "{{ 'locked' if is_state('input_boolean.slow_lock_locked', 'on') else 'unlocked' }}"
        lock:
          - delay: 2
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.slow_lock_locked
        unlock:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.slow_lock_locked
      - name: Unavailable lock
        unique_id: unavailable_lock
        availability: "{{ false }}"
        state: "{{ 'unlocked' }}"
        lock: []
        unlock: []
  - cover:
      - name: Test cover
        unique_id: test_cover
        device_class: garage
        state: "{{ 'closed' if is_state('input_boolean.test_cover_closed', 'on') else 'open' }}"
        close_cover:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.test_cover_closed
        open_cover:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.test_cover_closed

alarm_control_panel:
  - platform: manual
    name: Test alarm
    unique_id: test_alarm
    code_arm_required: false
    arming_time: 0
    delay_time: 0
  # Arming and disarming both need the code.
  - platform: manual
    name: Code alarm
    unique_id: code_alarm
    code: "1234"
    arming_time: 0
    delay_time: 0
