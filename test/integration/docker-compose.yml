name: onlylocklock-test

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION:-2026.10.4}
    ports:
      - "127.0.0.1:${HA_PORT:-18123}:8123"
    # Copy the seed config into the container instead of bind-mounting it, so every
    # run starts unonboarded and HA's .storage never ends up in the repo.
    entrypoint: ["sh", "-c", "cp -R /seed/. /config/ && exec /init"]
    volumes:
      - ./ha-config:/seed:ro
      # The bundle from `npm run build`, served as /local/onlylocklock/. Global setup
      # builds it first, so the directory exists before Docker mounts it.
      - ../../dist:/config/www/onlylocklock:ro
